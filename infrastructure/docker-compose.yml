# Banco para desenvolvimento local.
# Uso: docker compose -f infrastructure/docker-compose.yml up -d
name: smarthealth

services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: smarthealth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarthealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthealth}
      POSTGRES_DB: ${POSTGRES_DB:-smarthealth}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
